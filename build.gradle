//
// One script, two builds. Inside ModdedBench this is the :baritone project and the root build has
// already applied the shared conventions (Java toolchain, RetroFuturaGradle, jar name). Built alone
// (settings.gradle) this is the root project and applies the same conventions itself.
plugins {
    id 'java-library'
    id 'com.gtnewhorizons.retrofuturagradle'
}

if (project == rootProject) {
    allprojects {
        apply plugin: 'java-library'
        group = 'dev.modbench'
        version = '0.1.0'
        repositories { mavenCentral() }
        java {
            toolchain { languageVersion = JavaLanguageVersion.of(21) }
            withSourcesJar()
        }
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }
        tasks.withType(JavaCompile).matching { it.name in ['compileJava', 'compileTestJava'] }.configureEach {
            options.release = 17
        }
        dependencies { testImplementation 'junit:junit:4.13.2' }
        tasks.withType(Test).configureEach { useJUnit() }
    }
    // The api sources belong to another checkout: nothing is written there.
    project(':api') { layout.buildDirectory = rootProject.layout.buildDirectory.dir('modbench-api') }
    minecraft {
        mcVersion = '1.7.10'
        javaCompatibilityVersion = 17
        // Minecraft's own decompilation/recompilation still uses its Java 8 toolchain.
        jvmLanguageVersion = JavaLanguageVersion.of(8)
        username = 'ModbenchDev'
        userUUID = '3ba1bc1f-38db-3d85-86ff-07184d30b7a9'
    }
    tasks.named('jar', Jar) {
        archiveBaseName = 'modbench-baritone'
        manifest { attributes('Implementation-Version': project.version) }
    }
    tasks.named('processResources') {
        inputs.property('version', project.version)
        filesMatching('mcmod.info') { expand(version: project.version) }
    }
}

sourceSets.main.java.srcDir 'src/upstream/java'
configurations { fastutilBundle { transitive = false } }
dependencies {
    // Only the api: the compiler enforces the seam between Baritone and the core mod.
    compileOnly project(':api')
    // fastutil is not shipped by MC 1.7.10 or the pack, so the jar bundles it from a
    // detached configuration: resolving runtimeClasspath while wiring the jar task
    // would run RFG's deobf transform on the unbuilt api jar.
    compileOnly 'it.unimi.dsi:fastutil:8.5.15'
    testRuntimeOnly 'it.unimi.dsi:fastutil:8.5.15'
    fastutilBundle 'it.unimi.dsi:fastutil:8.5.15'
    testImplementation project(':api')
    // Allocating Minecraft for the settings persistence boundary resolves
    // its declared legacy LWJGL exception types even though no display is
    // created by the test.
    testRuntimeOnly 'org.lwjgl.lwjgl:lwjgl:2.9.4-nightly-20150209'
}
tasks.named('compileJava') { options.compilerArgs += ['-Xmaxerrs', '1000'] }
tasks.named('test') {
    dependsOn ':api:jar'
    // Resolved at execution time: .asPath here would run RFG's deobf transform on
    // sibling project jars before they are built.
    doFirst {
        systemProperty 'modbench.test.classpath', sourceSets.test.runtimeClasspath.asPath
        systemProperty 'modbench.classes', sourceSets.main.output.classesDirs.asPath
    }
}
tasks.named('jar') {
    from({ configurations.fastutilBundle.collect { zipTree(it) } }) {
        include 'it/unimi/dsi/fastutil/**'
    }
    // The jar is handed round by itself, so the licence texts and notices travel inside it.
    from(file('LICENSE')) { into 'META-INF/licenses'; rename { 'Baritone-LGPL-3.0.txt' } }
    from(file('NOTICE.md')) { into 'META-INF/licenses'; rename { 'Modatone-NOTICE.md' } }
    from(file('licenses')) { into 'META-INF/licenses' }
    from(file('UPSTREAM_SOURCES.json')) { into 'META-INF/modbench' }
}
